# Development overrides — NOT for production
# Exposes service ports directly for local debugging

services:
  # Full local postgres definition (base compose keeps it commented out so
  # production can point DATABASE_URL at an external database like Supabase).
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus} -d ${POSTGRES_DB:-nexus}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus-internal
    ports:
      - "5432:5432"

  qdrant:
    ports:
      - "6333:6333"
      - "6334:6334"

  # Local redis/minio containers removed — REDIS_URL (Upstash) and Supabase
  # Storage from .env are used in every mode.

  backend:
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      LOG_LEVEL: DEBUG
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    volumes:
      - ./backend:/app
    environment:
      LOG_LEVEL: DEBUG
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    ports:
      - "3000:3000"

  prometheus:
    ports:
      - "9090:9090"

  grafana:
    ports:
      - "3001:3001"
