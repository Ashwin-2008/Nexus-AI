# Development overrides — NOT for production
# Exposes service ports directly for local debugging

services:
  postgres:
    ports:
      - "5432:5432"

  qdrant:
    ports:
      - "6333:6333"
      - "6334:6334"

  redis:
    ports:
      - "6379:6379"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  backend:
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      LOG_LEVEL: DEBUG

  worker:
    volumes:
      - ./backend:/app
    environment:
      LOG_LEVEL: DEBUG

  frontend:
    ports:
      - "3000:3000"

  prometheus:
    ports:
      - "9090:9090"

  grafana:
    ports:
      - "3001:3001"
