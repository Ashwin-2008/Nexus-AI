name: Nexus AI CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  POSTGRES_PASSWORD: ci_test_password
  REDIS_PASSWORD: ci_redis_password
  MINIO_ACCESS_KEY: ci_minio_key
  MINIO_SECRET_KEY: ci_minio_secret
  JWT_SECRET: ci_jwt_secret_for_testing_only
  GRAFANA_PASSWORD: ci_grafana_password

jobs:

  # ── Backend ──────────────────────────────────────────────────────────────────
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: nexus_test
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: ci_test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_test"
          --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check . || true

      - name: Type check (mypy)
        run: mypy app/ --ignore-missing-imports || true

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://nexus:ci_test_password@localhost:5432/nexus_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci_jwt_secret_for_testing_only
          QDRANT_URL: ""
          MINIO_ENDPOINT: ""
          MINIO_ACCESS_KEY: ci_minio_key
          MINIO_SECRET_KEY: ci_minio_secret
          OPENAI_API_KEY: ""
        run: pytest tests/ -v --tb=short --junitxml=test-results.xml || true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/test-results.xml

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend-validation:
    name: Frontend Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check || true

      - name: Lint
        run: npm run lint || true

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: /api/v1

  # ── Docker Builds ─────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-validation]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build worker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.worker
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          build-args: VITE_API_BASE_URL=/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Integration Tests ─────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Create .env
        run: |
          cp .env.example .env
          sed -i "s/change_me_strong_password/${{ env.POSTGRES_PASSWORD }}/" .env
          sed -i "s/change_me_redis_password/${{ env.REDIS_PASSWORD }}/" .env
          sed -i "s/change_me_minio_access_key/${{ env.MINIO_ACCESS_KEY }}/" .env
          sed -i "s/change_me_minio_secret_key/${{ env.MINIO_SECRET_KEY }}/" .env
          sed -i "s/change_me_generate_with_openssl_rand_hex_32/${{ env.JWT_SECRET }}/" .env
          sed -i "s/change_me_grafana_password/${{ env.GRAFANA_PASSWORD }}/" .env
          sed -i "s|sk-...|ci_no_openai_key|" .env

      - name: Start services
        run: docker compose up --build -d --wait
        timeout-minutes: 10

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost/api/v1/health; then
              echo "Backend healthy"; break
            fi
            echo "Waiting... ($i/30)"; sleep 5
          done

      - name: Run integration tests
        run: |
          pip install requests
          python tests/integration/test_integration.py
        env:
          NEXUS_BASE_URL: http://localhost

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Tear down
        if: always()
        run: docker compose down -v
