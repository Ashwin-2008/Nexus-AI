openapi: 3.0.3
info:
  title: NEXUS AI API
  version: 0.10.0
  description: API contract for NEXUS AI authentication, document ingestion, grounded search/chat, the modular RAG subsystem, connectors, durable agent workflows, safe SQL intelligence, and approvals.
servers:
  - url: http://localhost:8000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
          required: [code, message]
    ConversationRead:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string, nullable: true }
        user_id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, user_id, organization_id, created_at, updated_at]
    ChatMessageRead:
      type: object
      properties:
        id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        citations:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              chunk_id: { type: string, format: uuid }
              document_id: { type: string, format: uuid }
              document_filename: { type: string }
              provenance: { type: array, items: { type: object } }
              score: { type: number }
              text: { type: string }
        meta:
          type: object
          properties:
            answer_mode: { type: string, enum: [llm, extractive, no_evidence] }
            model: { type: string }
            retrieval_latency_ms: { type: integer }
            generation_latency_ms: { type: integer, nullable: true }
            prompt_tokens: { type: integer, nullable: true }
            completion_tokens: { type: integer, nullable: true }
            insufficient_evidence: { type: boolean }
            degraded_from: { type: string, nullable: true }
            verification: { allOf: [{ $ref: '#/components/schemas/RagVerification' }], nullable: true }
            trace_id: { type: string }
            warnings: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
      required: [id, conversation_id, role, content, created_at]
    SourceCreate:
      type: object
      required: [name, type]
      properties:
        name: { type: string, maxLength: 255 }
        type: { type: string, enum: [postgres, mysql, rest, website, github, gdrive, email] }
        config: { type: object }
        credentials: { type: object }
    SourceUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 255 }
        config: { type: object }
        credentials: { type: object }
        status: { type: string, enum: [active, disabled] }
    SourceRead:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string }
        status: { type: string, enum: [active, error, disabled] }
        config: { type: object }
        credentials_masked:
          type: object
          nullable: true
          description: Masked credential shape (secrets replaced); full values are never returned
        last_synced_at: { type: string, format: date-time, nullable: true }
        last_sync_status: { type: string, nullable: true }
        last_error: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, name, type, status, created_at, updated_at]
    SyncJobRead:
      type: object
      properties:
        id: { type: string, format: uuid }
        data_source_id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, succeeded, failed] }
        fetched: { type: integer }
        ingested: { type: integer }
        skipped: { type: integer }
        failed: { type: integer }
        error: { type: string, nullable: true }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
      required: [id, data_source_id, status, started_at]
    AgentExecution:
      type: object
      required: [id, agent_type, status, request, plan, created_at]
      properties:
        id: { type: string, format: uuid }
        agent_type: { type: string }
        status: { type: string, enum: [queued, running, succeeded, failed] }
        request: { type: string }
        plan: { type: object }
        result: { type: object, nullable: true }
        error: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        services:
          type: object
          additionalProperties: { type: string }
          description: "Service checks may include api,database,redis,qdrant,storage,worker"
      required: [status, services]
    UserCreate:
      type: object
      required: [email, password, organization_name]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        full_name: { type: string, nullable: true }
        organization_name: { type: string }
    UserLogin:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    UserRead:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        full_name: { type: string, nullable: true }
        is_active: { type: boolean }
        organization_id: { type: string, format: uuid }
        role: { type: string }
        created_at: { type: string, format: date-time }
    Token:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, example: bearer }
        refresh_token: { type: string, nullable: true }
      required: [access_token, token_type]
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
    LogoutRequest:
      type: object
      properties:
        refresh_token: { type: string, nullable: true }
        all_sessions: { type: boolean, default: false }
    Message:
      type: object
      properties:
        message: { type: string }
    IngestionJobRead:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, succeeded, failed, retrying] }
        attempt: { type: integer }
        max_attempts: { type: integer }
        task_id: { type: string, nullable: true }
        worker: { type: string, nullable: true }
        error_message: { type: string, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DocumentRead:
      type: object
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        uploaded_by: { type: string, format: uuid, nullable: true }
        filename: { type: string }
        content_type: { type: string }
        file_size: { type: integer }
        storage_backend: { type: string, nullable: true }
        status: { type: string, enum: [pending, processing, completed, failed] }
        error_message: { type: string, nullable: true }
        retry_count: { type: integer }
        metadata: { type: object, nullable: true }
        latest_job: { $ref: '#/components/schemas/IngestionJobRead', nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DocumentList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DocumentRead' }
    RagFilters:
      type: object
      additionalProperties: false
      properties:
        document_ids: { type: array, items: { type: string, format: uuid } }
        source_ids: { type: array, items: { type: string, format: uuid } }
        source_types: { type: array, items: { type: string } }
        document_version: { type: integer, nullable: true }
        metadata: { type: object, additionalProperties: { type: string } }
    RagQueryRequest:
      type: object
      required: [query]
      additionalProperties: false
      properties:
        query: { type: string, minLength: 1, maxLength: 8000 }
        filters: { $ref: '#/components/schemas/RagFilters' }
        mode: { type: string, enum: [hybrid, dense, sparse], nullable: true }
        top_k: { type: integer, minimum: 1, maximum: 50, nullable: true }
        rerank: { type: boolean, nullable: true }
        verify: { type: boolean, nullable: true }
        conversation_id: { type: string, nullable: true }
        max_context_tokens: { type: integer, minimum: 256, maximum: 32000, nullable: true }
        include_evidence: { type: boolean, default: true }
    RagCitation:
      type: object
      properties:
        citation_id: { type: string }
        index: { type: integer }
        chunk_id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        document_title: { type: string }
        document_filename: { type: string }
        source_type: { type: string }
        organization_id: { type: string, format: uuid }
        document_version: { type: integer }
        page_number: { type: integer, nullable: true }
        section_heading: { type: string, nullable: true }
        source_span: { type: object, nullable: true }
        url: { type: string, nullable: true }
        file_reference: { type: string, nullable: true }
        source_id: { type: string, nullable: true }
        score: { type: number }
        evidence_text: { type: string }
        text: { type: string }
        provenance: { type: array, items: { type: object } }
    RagVerificationClaim:
      type: object
      properties:
        claim: { type: string }
        status: { type: string, enum: [supported, partially_supported, unsupported, conflicting_evidence, insufficient_evidence] }
        citation_indices: { type: array, items: { type: integer } }
        evidence_chunk_ids: { type: array, items: { type: string } }
        support_score: { type: number }
        reasons: { type: array, items: { type: string } }
        unsupported_numbers: { type: array, items: { type: string } }
    RagVerification:
      type: object
      properties:
        status: { type: string, enum: [supported, partially_supported, unsupported, conflicting_evidence, insufficient_evidence] }
        claims: { type: array, items: { $ref: '#/components/schemas/RagVerificationClaim' } }
        unsupported_claims: { type: array, items: { type: string } }
        conflicting_claims: { type: array, items: { type: string } }
        insufficient_claims: { type: array, items: { type: string } }
        citation_errors: { type: array, items: { type: string } }
        evidence_coverage: { type: number }
        method: { type: string }
        disclaimer: { type: string }
    RagQueryResponse:
      type: object
      properties:
        answer: { type: string }
        answer_mode: { type: string, enum: [llm, extractive, no_evidence] }
        model: { type: string }
        citations: { type: array, items: { $ref: '#/components/schemas/RagCitation' } }
        evidence: { type: array, items: { type: object } }
        verification: { allOf: [{ $ref: '#/components/schemas/RagVerification' }], nullable: true }
        query_analysis: { type: object }
        timings: { type: object, additionalProperties: { type: integer } }
        trace_id: { type: string }
        insufficient_evidence: { type: boolean }
        warnings: { type: array, items: { type: string } }
        retrieval_mode: { type: string }
        reranker: { type: string, nullable: true }
        degraded_from: { type: string, nullable: true }
        context_chunk_count: { type: integer }
    RagIngestTextRequest:
      type: object
      required: [content]
      additionalProperties: false
      properties:
        content: { type: string, minLength: 1 }
        filename: { type: string, maxLength: 255, default: text.txt }
        title: { type: string, maxLength: 500, nullable: true }
        content_type: { type: string, default: text/plain }
        source_id: { type: string, format: uuid, nullable: true }
        access_scope: { type: string, enum: [organization, private, admin], default: organization }
        metadata: { type: object }
    RagRetrievalTestRequest:
      type: object
      required: [query]
      properties:
        query: { type: string }
        filters: { $ref: '#/components/schemas/RagFilters' }
        mode: { type: string, enum: [hybrid, dense, sparse], nullable: true }
        top_k: { type: integer, minimum: 1, maximum: 100, nullable: true }
        rerank: { type: boolean, nullable: true }
        include_text: { type: boolean, default: true }
    RagEvaluationRequest:
      type: object
      properties:
        dataset: { type: string, nullable: true }
        items:
          type: array
          items:
            type: object
            required: [query]
            properties:
              query: { type: string }
              relevant_chunk_ids: { type: array, items: { type: string } }
              relevant_document_ids: { type: array, items: { type: string } }
              reference_answer: { type: string, nullable: true }
              tags: { type: array, items: { type: string } }
        name: { type: string, default: evaluation }
        mode: { type: string, enum: [hybrid, dense, sparse], nullable: true }
        k: { type: integer, minimum: 1, maximum: 50, default: 5 }
        generate: { type: boolean, default: false }
        persist: { type: boolean, default: true }
    UserProfileUpdate:
      type: object
      properties:
        full_name: { type: string, maxLength: 255, nullable: true }
        email: { type: string, format: email, nullable: true }
    PasswordChange:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, minLength: 1, maxLength: 128 }
        new_password: { type: string, minLength: 8, maxLength: 128 }
    AdminOverview:
      type: object
      properties:
        organization:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string, nullable: true }
        counts:
          type: object
          additionalProperties: { type: integer }
        role: { type: string, nullable: true }
    AdminUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        full_name: { type: string, nullable: true }
        role: { type: string, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
    AuditLogEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, nullable: true }
        action: { type: string }
        resource_type: { type: string, nullable: true }
        resource_id: { type: string, nullable: true }
        details: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    AnalyticsOverview:
      type: object
      properties:
        window_days: { type: integer }
        generated_at: { type: string, format: date-time }
        queries:
          type: object
          properties:
            total_all_time: { type: integer }
            window: { type: integer }
            successful: { type: integer }
            no_evidence: { type: integer }
            success_rate: { type: number, nullable: true }
            avg_latency_ms: { type: number, nullable: true }
            p95_latency_ms: { type: number, nullable: true }
            avg_retrieval_ms: { type: number, nullable: true }
        series:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              queries: { type: integer }
              avg_retrieval_ms: { type: number }
              avg_total_ms: { type: number }
              no_evidence: { type: integer }
        distribution:
          type: object
          properties:
            answer_modes: { type: object, additionalProperties: { type: integer } }
            verification: { type: object, additionalProperties: { type: integer } }
            retrieval_modes: { type: object, additionalProperties: { type: integer } }
        agents:
          type: object
          properties:
            total: { type: integer }
            by_status: { type: object, additionalProperties: { type: integer } }
            avg_duration_ms: { type: number, nullable: true }
        knowledge:
          type: object
          properties:
            documents_by_status: { type: object, additionalProperties: { type: integer } }
            documents_total: { type: integer }
            chunks: { type: integer }
            sources: { type: integer }
            active_sources: { type: integer }
        activity:
          type: object
          properties:
            conversations: { type: integer }
            reports: { type: integer }
            pending_approvals: { type: integer }
            active_ingestions: { type: integer }
        evaluation:
          type: object
          properties:
            run_id: { type: string, nullable: true }
            name: { type: string, nullable: true }
            dataset: { type: string, nullable: true }
            item_count: { type: integer, nullable: true }
            metrics: { type: object, additionalProperties: { type: number } }
            created_at: { type: string, nullable: true }
paths:
  /:
    get:
      summary: Root status
      responses:
        '200':
          description: Service status
  /api/v1/health:
    get:
      summary: Health check
      responses:
        '200':
          description: Health status with dependency checks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /metrics:
    get:
      summary: Prometheus metrics
      responses:
        '200':
          description: Prometheus text exposition format
          content:
            text/plain:
              schema:
                type: string
  /api/v1/auth/register:
    post:
      summary: Register user and organization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserRead' }
        '400':
          description: Validation/policy error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/auth/login:
    post:
      summary: Login (returns access + refresh token)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserLogin' }
      responses:
        '200':
          description: Token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Token' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/auth/refresh:
    post:
      summary: Rotate refresh token and issue new access token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Token' }
        '401':
          description: Invalid/revoked/expired refresh token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/auth/logout:
    post:
      summary: Logout (revoke refresh token/session)
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/auth/me:
    get:
      summary: Current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserRead' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    patch:
      summary: Update current user's profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserProfileUpdate' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserRead' }
        '400': { description: Invalid profile }
        '409': { description: Email already registered }
  /api/v1/auth/change-password:
    post:
      summary: Change current user's password and revoke refresh tokens
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChange' }
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { description: Incorrect current password or weak new password }
  /api/v1/upload:
    post:
      summary: Upload document (compatibility alias for /api/v1/documents/upload)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Document created and queued for ingestion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentRead' }
        '400':
          description: Invalid file
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/documents/upload:
    post:
      summary: Upload document (PDF/DOCX/TXT/CSV/Excel)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Document created and queued for ingestion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentRead' }
        '400':
          description: Invalid file
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/documents:
    get:
      summary: List documents for current organization
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Document list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentList' }
  /api/v1/documents/{document_id}:
    get:
      summary: Get document by id (org-isolated)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: document_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentRead' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/sources:
    post:
      summary: Create a data source (connector)
      description: >
        Config is validated by the connector implementation before creation.
        Credentials are encrypted at rest (Fernet, key derived from SECRET_KEY)
        and never returned by the API (masked only). Types: postgres, mysql,
        rest, website, github, gdrive, email.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceCreate' }
      responses:
        '201':
          description: Data source created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceRead' }
        '400':
          description: Unknown type or invalid config
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
