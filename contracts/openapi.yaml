openapi: 3.0.3
info:
  title: NEXUS AI API
  version: 0.7.0
  description: API contract for NEXUS AI authentication, document ingestion, grounded search/chat, connectors, durable agent workflows, safe SQL intelligence, and approvals.
servers:
  - url: http://localhost:8000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
          required: [code, message]
    ConversationRead:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string, nullable: true }
        user_id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, user_id, organization_id, created_at, updated_at]
    ChatMessageRead:
      type: object
      properties:
        id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        citations:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              chunk_id: { type: string, format: uuid }
              document_id: { type: string, format: uuid }
              document_filename: { type: string }
              provenance: { type: array, items: { type: object } }
              score: { type: number }
              text: { type: string }
        meta:
          type: object
          properties:
            answer_mode: { type: string, enum: [llm, extractive, no_evidence] }
            model: { type: string }
            retrieval_latency_ms: { type: integer }
            generation_latency_ms: { type: integer, nullable: true }
            prompt_tokens: { type: integer, nullable: true }
            completion_tokens: { type: integer, nullable: true }
            insufficient_evidence: { type: boolean }
            degraded_from: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
      required: [id, conversation_id, role, content, created_at]
    SourceCreate:
      type: object
      required: [name, type]
      properties:
        name: { type: string, maxLength: 255 }
        type: { type: string, enum: [postgres, mysql, rest, website, github, gdrive, email] }
        config: { type: object }
        credentials: { type: object }
    SourceUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 255 }
        config: { type: object }
        credentials: { type: object }
        status: { type: string, enum: [active, disabled] }
    SourceRead:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string }
        status: { type: string, enum: [active, error, disabled] }
        config: { type: object }
        credentials_masked:
          type: object
          nullable: true
          description: Masked credential shape (secrets replaced); full values are never returned
        last_synced_at: { type: string, format: date-time, nullable: true }
        last_sync_status: { type: string, nullable: true }
        last_error: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, name, type, status, created_at, updated_at]
    SyncJobRead:
      type: object
      properties:
        id: { type: string, format: uuid }
        data_source_id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, succeeded, failed] }
        fetched: { type: integer }
        ingested: { type: integer }
        skipped: { type: integer }
        failed: { type: integer }
        error: { type: string, nullable: true }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
      required: [id, data_source_id, status, started_at]
    AgentExecution:
      type: object
      required: [id, agent_type, status, request, plan, created_at]
      properties:
        id: { type: string, format: uuid }
        agent_type: { type: string }
        status: { type: string, enum: [queued, running, succeeded, failed] }
        request: { type: string }
        plan: { type: object }
        result: { type: object, nullable: true }
        error: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        services:
          type: object
          additionalProperties: { type: string }
          description: "Service checks may include api,database,redis,qdrant,storage,worker"
      required: [status, services]
    UserCreate:
      type: object
      required: [email, password, organization_name]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        full_name: { type: string, nullable: true }
        organization_name: { type: string }
    UserLogin:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    UserRead:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        full_name: { type: string, nullable: true }
        is_active: { type: boolean }
        organization_id: { type: string, format: uuid }
        role: { type: string }
        created_at: { type: string, format: date-time }
    Token:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, example: bearer }
        refresh_token: { type: string, nullable: true }
      required: [access_token, token_type]
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
    LogoutRequest:
      type: object
      properties:
        refresh_token: { type: string, nullable: true }
        all_sessions: { type: boolean, default: false }
    Message:
      type: object
      properties:
        message: { type: string }
    IngestionJobRead:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, succeeded, failed, retrying] }
        attempt: { type: integer }
        max_attempts: { type: integer }
        task_id: { type: string, nullable: true }
        worker: { type: string, nullable: true }
        error_message: { type: string, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DocumentRead:
      type: object
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        uploaded_by: { type: string, format: uuid, nullable: true }
        filename: { type: string }
        content_type: { type: string }
        file_size: { type: integer }
        storage_backend: { type: string, nullable: true }
        status: { type: string, enum: [pending, processing, completed, failed] }
        error_message: { type: string, nullable: true }
        retry_count: { type: integer }
        metadata: { type: object, nullable: true }
        latest_job: { $ref: '#/components/schemas/IngestionJobRead', nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DocumentList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DocumentRead' }
paths:
  /:
    get:
      summary: Root status
      responses:
        '200':
          description: Service status
  /api/v1/health:
    get:
      summary: Health check
      responses:
        '200':
          description: Health status with dependency checks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /metrics:
    get:
      summary: Prometheus metrics
      responses:
        '200':
          description: Prometheus text exposition format
          content:
            text/plain:
              schema:
                type: string
  /api/v1/auth/register:
    post:
      summary: Register user and organization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserRead' }
        '400':
          description: Validation/policy error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/auth/login:
    post:
      summary: Login (returns access + refresh token)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserLogin' }
      responses:
        '200':
          description: Token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Token' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/auth/refresh:
    post:
      summary: Rotate refresh token and issue new access token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Token' }
        '401':
          description: Invalid/revoked/expired refresh token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/auth/logout:
    post:
      summary: Logout (revoke refresh token/session)
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/auth/me:
    get:
      summary: Current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserRead' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/upload:
    post:
      summary: Upload document (compatibility alias for /api/v1/documents/upload)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Document created and queued for ingestion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentRead' }
        '400':
          description: Invalid file
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/documents/upload:
    post:
      summary: Upload document (PDF/DOCX/TXT/CSV/Excel)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Document created and queued for ingestion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentRead' }
        '400':
          description: Invalid file
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/documents:
    get:
      summary: List documents for current organization
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Document list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentList' }
  /api/v1/documents/{document_id}:
    get:
      summary: Get document by id (org-isolated)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: document_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentRead' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/sources:
    post:
      summary: Create a data source (connector)
      description: >
        Config is validated by the connector implementation before creation.
        Credentials are encrypted at rest (Fernet, key derived from SECRET_KEY)
        and never returned by the API (masked only). Types: postgres, mysql,
        rest, website, github, gdrive, email.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceCreate' }
      responses:
        '201':
          description: Data source created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceRead' }
        '400':
          description: Unknown type or invalid config
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      summary: List the organization's data sources
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sources (org-scoped)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SourceRead' }
  /api/v1/sources/{source_id}:
    get:
      summary: Get a data source (org-scoped; 404 otherwise)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: source_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Data source
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceRead' }
        '404':
          description: Not found (never 403 — avoids existence leak)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    patch:
      summary: Update a data source (name/config/credentials/status)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: source_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceUpdate' }
      responses:
        '200':
          description: Updated source
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceRead' }
        '400':
          description: Invalid merged config
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      summary: Delete a data source and its connector-created documents
      description: >
        Also removes connector-created documents (deterministic
        connector/<type>/ filename prefix) from Postgres and the vector index.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: source_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/sources/{source_id}/test:
    post:
      summary: Validate config / probe connectivity
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: source_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: "{ok: true} or {ok: false, error}"
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  type: { type: string }
                  error: { type: string }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/sources/{source_id}/sync:
    post:
      summary: Trigger a connector sync
      description: >
        Queues a sync job (Celery worker in production; executed synchronously
        when Celery is unavailable). Items are deduplicated by content hash and
        ingested through the standard pipeline (storage → extraction →
        chunking → embeddings → vector index), so connector content is
        searchable and answerable like uploaded documents.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: source_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202':
          description: Sync job created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncJobRead' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Source is disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/sources/{source_id}/syncs:
    get:
      summary: List recent sync jobs for a source (latest first)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: source_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Sync job history (max 20)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SyncJobRead' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/chat/conversations:
    post:
      summary: Create a chat conversation (user-owned, org-scoped)
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 255 }
      responses:
        '201':
          description: Conversation created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationRead' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      summary: List current user's conversations in their organization
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Conversation list (most recently updated first)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConversationRead' }
  /api/v1/chat/conversations/{conversation_id}:
    get:
      summary: Get conversation (owner + org only; 404 otherwise)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: conversation_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Conversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationRead' }
        '404':
          description: Not found (never 403 — avoids existence leak)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      summary: Delete conversation and its messages
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: conversation_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/chat/conversations/{conversation_id}/messages:
    get:
      summary: List messages of a conversation (owner + org only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: conversation_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Messages in chronological order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChatMessageRead' }
    post:
      summary: Post a message and get a grounded RAG answer
      description: >
        Streaming mode (default) responds with text/event-stream events:
        message_start, context, token (LLM mode only), message_end, error.
        Frontend clients MUST use fetch() with a ReadableStream (EventSource
        cannot POST). Non-streaming mode returns the complete assistant
        message JSON. Answers are grounded in retrieved org-scoped chunks;
        every citation maps to an actually retrieved chunk; insufficient
        evidence is reported explicitly (answer_mode=no_evidence,
        insufficient_evidence=true) instead of invented content. When no LLM
        is configured or the LLM fails, answers degrade to grounded
        extractive passages (answer_mode=extractive, model=none) or
        no_evidence — never fabricated generation.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: conversation_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, minLength: 1, maxLength: 8000 }
                stream: { type: boolean, default: true }
      responses:
        '200':
          description: >
            Non-streaming: ChatMessageRead. Streaming: SSE event stream
            (text/event-stream) — persists the assistant message before
            closing; clients must also reload messages for full history.
        '404':
          description: Conversation not found / not owned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: Retrieval backend unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/documents/{document_id}/retry:
    post:
      summary: Retry document ingestion (failed/completed)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: document_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Requeued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentRead' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Not retryable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/search:
    get:
      summary: Search the organization's indexed knowledge (semantic/lexical/hybrid)
      description: >
        All modes are scoped to the authenticated user's organization.
        semantic: Qdrant cosine similarity with org filter. lexical: BM25 over
        persisted chunks. hybrid: Reciprocal Rank Fusion of both rankings.
        Embedding provider is configurable (openai_compatible | local |
        hashing); hashing produces non-semantic vectors and is for dev/test only.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 1, maxLength: 512 }
        - in: query
          name: mode
          schema: { type: string, enum: [semantic, lexical, hybrid], default: hybrid }
        - in: query
          name: top_k
          schema: { type: integer, minimum: 1, maximum: 50, default: 8 }
        - in: query
          name: document_ids
          schema: { type: string, description: Comma-separated document UUIDs }
      responses:
        '200':
          description: Search results with provenance
          content:
            application/json:
              schema:
                type: object
                required: [query, mode, total, hits]
                properties:
                  query: { type: string }
                  mode: { type: string, enum: [semantic, lexical, hybrid] }
                  total: { type: integer }
                  hits:
                    type: array
                    items:
                      type: object
                      required: [chunk_id, document_id, document_filename, chunk_index, text, score, mode]
                      properties:
                        chunk_id: { type: string, format: uuid }
                        document_id: { type: string, format: uuid }
                        document_filename: { type: string }
                        chunk_index: { type: integer }
                        text: { type: string }
                        provenance:
                          type: array
                          items:
                            type: object
                            properties:
                              kind: { type: string, description: "page|paragraph|row|sheet_row|table_row|file" }
                              number: { type: integer }
                              row: { type: integer }
                              sheet: { type: string }
                        score: { type: number }
                        mode: { type: string }
                        metadata: { type: object }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: Search/embedding backend unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/agents/executions:
    post:
      summary: Run a permission-checked supervisor execution
      description: >
        Executes grounded retrieval by default. When source_id and sql are
        supplied, only a bounded single SELECT/WITH query can run against an
        organization-owned postgres or mysql source.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request]
              properties:
                request: { type: string, minLength: 1, maxLength: 8000 }
                source_id: { type: string, format: uuid, nullable: true }
                sql: { type: string, maxLength: 10000, nullable: true }
                max_rows: { type: integer, minimum: 1, maximum: 1000, default: 100 }
      responses:
        '201':
          description: Completed execution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentExecution' }
        '400':
          description: Validation, authorization, or tool execution failure
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      summary: List the current user's agent executions
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Agent executions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AgentExecution' }
  /api/v1/agents/executions/{execution_id}:
    get:
      summary: Get one current-user agent execution
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: execution_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Agent execution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentExecution' }
        '404':
          description: Execution not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
