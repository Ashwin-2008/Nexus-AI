global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: nexus-ai

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: nexus-backend
    static_configs:
      - targets: [backend:8000]
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: nexus-worker
    static_configs:
      - targets: [worker:9090]
    metrics_path: /metrics
    scrape_interval: 15s

  # Render deployment (optional): scrape the public API service directly.
  # Replace <service-name> with the Render service slug and delete this block
  # if you use Grafana Cloud agentless scraping instead (see docs/DEPLOYMENT.md).
  # - job_name: nexus-api-render
  #   scheme: https
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: [<service-name>.onrender.com]

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]

  - job_name: nginx
    static_configs:
      - targets: [nginx:9113]

# Grafana Cloud: ship the series above to the hosted Prometheus.
# Prometheus does not expand environment variables here — paste the literal
# URL / numeric user id / API token from Grafana Cloud → Stack → Prometheus.
# remote_write:
#   - url: https://prometheus-prod-<region>.grafana.net/api/prom/push
#     basic_auth:
#       username: <prometheus-user-id>
#       password: <grafana-cloud-api-token>
#     write_relabel_configs:
#       # Drop the local scrape duplicates if you also scrape the Render API
#       # directly from Grafana Cloud.
#       - source_labels: [__name__]
#         regex: prometheus_.*
#         action: drop
