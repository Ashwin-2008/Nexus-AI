global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: nexus-ai

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: nexus-backend
    static_configs:
      - targets: [backend:8000]
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: nexus-worker
    static_configs:
      - targets: [worker:9090]
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]

  - job_name: nginx
    static_configs:
      - targets: [nginx:9113]
